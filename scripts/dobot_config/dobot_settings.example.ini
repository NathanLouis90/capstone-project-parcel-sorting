# Copy this template to dobot_settings.ini on a new checkout.
# Fill in your device identities and calibrate before operating the robot.
# Zero offsets below are not calibrated values for a physical robot.
# Keep the real dobot_settings.ini local; never commit a workstation password.

[COMPUTER]
# Leave blank unless the local device-permission tools need your sudo password.
# Enter any required password in the local copy only.
passcode =

# Replace all three camera serial placeholders.
[CAMERA]
top = YOUR_TOP_CAMERA_SERIAL
left = YOUR_LEFT_WRIST_CAMERA_SERIAL
right = YOUR_RIGHT_WRIST_CAMERA_SERIAL

# Example motor IDs, signs, ports and initial joint angles: verify for your leaders.
# joint_offsets and gripper_config offsets are replaced during calibration.
[HAND_LEFT]
joint_ids = 1, 2, 4, 5, 6, 7
append_id = 3
joint_offsets = 0, 0, 0, 0, 0, 0
start_joints = -1.57, 0, -1.57, 0, 1.57, 1.57
joint_signs = 1, 1, -1, -1, -1, 1
gripper_config = 8, 0, 0
port = /dev/ttyACM0
baud_rate = 2000000
using_sensor = 0

[HAND_RIGHT]
joint_ids = 11, 12, 14, 15, 16, 17
append_id = 13
joint_offsets = 0, 0, 0, 0, 0, 0
start_joints = 1.57, 0, 1.57, 0, -1.57, -1.57
joint_signs = 1, 1, -1, -1, -1, 1
gripper_config = 18, 0, 0
port = /dev/ttyACM1
baud_rate = 2000000
using_sensor = 0

# Example follower-gripper IDs, servo endpoints and ports: verify for your hardware.
[GRIPPER_LEFT]
id = 21
pos = 2048, 3052
port = /dev/ttyUSB1

[GRIPPER_RIGHT]
id = 22
pos = 2048, 3052
port = /dev/ttyUSB0
